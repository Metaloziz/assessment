# Same pattern as meme-app: Render Web (Docker) + Render Postgres.
# Dashboard → New → Blueprint → this repo / branch.

services:
  - type: web
    name: assessment-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://metaloziz.github.io,http://localhost:5173,http://127.0.0.1:5173

databases:
  - name: assessment-db
    plan: free
