# Blueprint: Render Dashboard → New → Blueprint → this repo
# DB: create free Postgres on Neon, paste DATABASE_URL in the service env (Render free DB often unavailable).

services:
  - type: web
    name: assessment-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: https://metaloziz.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_URL
        sync: false
