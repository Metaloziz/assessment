# Render Web (Docker) only — Postgres optional.
# Without DATABASE_URL labs use in-memory seed data.
# Dashboard → New → Blueprint → this repo / branch.

services:
  - type: web
    name: assessment-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: https://metaloziz.github.io,http://localhost:5173,http://127.0.0.1:5173
