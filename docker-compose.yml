# Optional local Postgres for offline API development.
# Default workflow: cloud Postgres (Neon/Render) via DATABASE_URL — see README.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - assessment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  assessment_pg:
